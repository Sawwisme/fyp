<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VetDental — My Appointments</title>

    <link rel="stylesheet" href="/web/styles.css">
    <link rel="stylesheet" href="/web/admin/dashboard.css">
    <link rel="stylesheet" href="/web/admin/layout.css">

    <script src="/web/vet/layout.js" defer></script>
    <script src="/web/vet/appointments.js" defer></script>
</head>

<body>
    <div id="vet-loading" class="loading">
        <p id="vet-loading-message" role="status">
            Loading your appointments…
        </p>
        <button id="vet-retry" class="secondary" type="button" hidden>
            Try again
        </button>
        <a href="/web/">Back to staff login</a>
    </div>

    <div id="vet-workspace" class="workspace" hidden>
        <aside id="shared-sidebar" class="sidebar"></aside>

        <div class="content-area">
            <header id="shared-topbar" class="topbar"></header>

            <main class="main-content">
                <div class="page-heading">
                    <h1>My Appointments</h1>
                    <p class="subtitle">
                        View your assigned appointments.
                        All times use Malaysia time.
                    </p>
                </div>

                <section class="panel" aria-labelledby="appointments-title">
                    <h2 id="appointments-title">Appointments</h2>

                    <div class="staff-list-toolbar">
                        <div>
                            <label class="field-label" for="vet-appointment-date">
                                Date
                            </label>
                            <input id="vet-appointment-date" type="date" required>
                        </div>

                        <div>
                            <label class="field-label" for="vet-appointment-search">
                                Search
                            </label>
                            <input id="vet-appointment-search" type="search" placeholder="Pet or owner name">
                        </div>

                        <div>
                            <label class="field-label" for="vet-appointment-status">
                                Status
                            </label>
                            <select id="vet-appointment-status">
                                <option value="">All statuses</option>
                                <option value="pending">Pending</option>
                                <option value="confirmed">Confirmed</option>
                                <option value="completed">Completed</option>
                                <option value="cancelled">Cancelled</option>
                                <option value="rejected">Rejected</option>
                            </select>
                        </div>
                    </div>

                    <p id="vet-appointment-message" role="status" aria-live="polite"></p>

                    <button id="vet-appointment-retry" type="button" class="secondary compact-button" hidden>
                        Try again
                    </button>

                    <div class="table-scroll">
                        <table class="staff-table">
                            <thead>
                                <tr>
                                    <th scope="col">Time</th>
                                    <th scope="col">Pet</th>
                                    <th scope="col">Owner</th>
                                    <th scope="col">Type</th>
                                    <th scope="col">Source</th>
                                    <th scope="col">Status</th>
                                </tr>
                            </thead>
                            <tbody id="vet-appointment-rows"></tbody>
                        </table>
                    </div>
                </section>
            </main>
        </div>
    </div>
</body>

</html>
