<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VetDental — Patients</title>

    <link rel="stylesheet" href="/web/styles.css?v=cobalt-components-2">
    <link rel="stylesheet" href="/web/admin/dashboard.css?v=cobalt-components-2">
    <link rel="stylesheet" href="/web/admin/layout.css?v=cobalt-components-2">

    <script src="/web/vet/layout.js" defer></script>
    <script src="/web/vet/patients.js?v=original-restored" defer></script>
    <link rel="stylesheet" href="/web/cobalt.css?v=cobalt-components-2">
    <link rel="stylesheet" href="/web/workspace-design.css?v=1">
    <link rel="stylesheet" href="/web/clinical-refinement.css?v=1">
    <link rel="stylesheet" href="/web/workspace-polish.css?v=1">
    <script src="/web/sidebar-controls.js?v=2" defer></script>
    <link rel="stylesheet" href="/web/sidebar-motion.css?v=1">
<link rel="stylesheet" href="/web/vet/patients.css?v=original-restored">
</head>

<body>
<div id="vet-loading" class="loading"><p id="vet-loading-message" role="status">Loading your account…</p><button id="vet-retry" type="button" class="secondary" hidden>Try again</button><a href="/web/">Back to staff login</a></div>
<div id="vet-workspace" class="workspace" hidden><aside id="shared-sidebar" class="sidebar"></aside><div class="content-area"><header id="shared-topbar" class="topbar"></header><main class="main-content">
<div class="patients-heading"><div><h1>Patients</h1><p class="subtitle">Your assigned patients and their care records at this clinic.</p></div><div class="patient-total"><span>Matching patients</span><strong id="patient-total">—</strong></div></div>
<section class="panel"><div class="patient-search"><label class="field-label" for="patient-search">Search patients</label><input id="patient-search" type="search" maxlength="100" placeholder="Pet or owner name"></div>
<p id="patient-message" role="status" aria-live="polite"></p><button id="patient-retry" class="secondary compact-button" hidden type="button">Try again</button>
<div class="table-scroll"><table class="staff-table"><thead><tr><th scope="col">Patient</th><th scope="col">Species / breed</th><th scope="col">Age</th><th scope="col">Owner</th><th scope="col">Records</th></tr></thead><tbody id="patient-rows"></tbody></table></div>
<div class="patient-pagination"><button id="patient-previous" type="button" class="secondary compact-button" disabled>Previous</button><button id="patient-next" type="button" class="secondary compact-button" disabled>Next</button></div></section>
</main></div></div>
<dialog id="patient-dialog" class="patient-dialog" aria-labelledby="patient-dialog-title"><header><h2 id="patient-dialog-title">Patient</h2><button id="patient-close" type="button" class="secondary compact-button" aria-label="Close patient records">×</button></header><div class="patient-dialog-body"><div id="patient-profile" class="patient-profile"></div><p class="muted">Records below belong to your care at this clinic. Dates use Malaysia time.</p><div class="patient-tabs" role="group" aria-label="Record type">
<button type="button" class="secondary compact-button" data-record-kind="consultations" aria-pressed="false">Consultations</button><button type="button" class="secondary compact-button" data-record-kind="appointments" aria-pressed="false">Appointments</button><button type="button" class="secondary compact-button" data-record-kind="treatments" aria-pressed="false">Treatments</button><button type="button" class="secondary compact-button" data-record-kind="prescriptions" aria-pressed="false">Prescriptions</button><button type="button" class="secondary compact-button" data-record-kind="followups" aria-pressed="false">Follow-up care</button></div><p id="record-message" role="status" aria-live="polite"></p><button id="record-retry" type="button" class="secondary compact-button" hidden>Try again</button><div id="patient-records"></div><div class="patient-pagination"><button id="record-previous" type="button" class="secondary compact-button" disabled>Previous</button><button id="record-next" type="button" class="secondary compact-button" disabled>Next</button></div></div></dialog></body></html>
