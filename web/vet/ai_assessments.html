<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VetDental — AI Assessments</title>

  <link rel="stylesheet" href="/web/styles.css?v=cobalt-components-2">
  <link rel="stylesheet" href="/web/admin/dashboard.css?v=cobalt-components-2">
  <link rel="stylesheet" href="/web/admin/layout.css?v=cobalt-components-2">
  <link rel="stylesheet" href="/web/cobalt.css?v=cobalt-components-2">
  <link rel="stylesheet" href="/web/workspace-design.css?v=1">
  <link rel="stylesheet" href="/web/workspace-polish.css?v=1">
  <link rel="stylesheet" href="/web/sidebar-motion.css?v=4">
  <link rel="stylesheet" href="/web/vet/ai_assessments.css?v=1">
  <link rel="stylesheet" href="/web/vet/patient_scans.css?v=1">

  <script src="/web/vet/layout.js" defer></script>
  <script src="/web/sidebar-controls.js?v=4" defer></script>
  <script src="/web/vet/appointment_scans.js?v=1" defer></script>
    <link rel="stylesheet" href="/web/staff-pagination.css?v=2">
</head>

<body>
  <div id="vet-loading" class="loading">
    <p id="vet-loading-message" role="status">Loading your workspace…</p>
    <button id="vet-retry" class="secondary" type="button" hidden>
      Try again
    </button>
    <a href="/web/">Back to staff login</a>
  </div>

  <div id="vet-workspace" class="workspace" hidden>
    <aside id="shared-sidebar" class="sidebar"></aside>

    <div class="content-area">
      <header id="shared-topbar" class="topbar"></header>

      <main class="main-content ai-review-page vet-scan-page">
        <div class="page-heading">
          <h1>AI Assessments</h1>
          <p class="subtitle">
            Scans shared for appointments assigned to you.
            Record clinical findings during consultation.
          </p>
        </div>

        <section class="panel">
          <div class="ar-toolbar">
            <div>
              <label for="scan-date">Appointment date</label>
              <input id="scan-date" type="date">
            </div>
            <button id="scan-refresh" class="secondary compact-button" type="button">
              Apply / refresh
            </button>
            <a href="/web/vet/assessment_review_history.html">
              Previous review records
            </a>
          </div>

          <p id="scans-message" role="status" aria-live="polite"></p>

          <div class="table-scroll">
            <table class="staff-table">
              <thead>
                <tr>
                  <th scope="col">Appointment</th>
                  <th scope="col">Patient</th>
                  <th scope="col">Owner</th>
                  <th scope="col">Status</th>
                  <th scope="col">Assessment</th>
                  <th scope="col">Action</th>
                </tr>
              </thead>
              <tbody id="scans-rows"></tbody>
            </table>
          </div>

          <div class="staff-pagination ar-pagination" aria-label="Pagination">
            <button id="scans-previous" class="secondary compact-button" type="button" disabled>
              Previous
            </button>
            <span id="scans-page">Page 1</span>
            <button id="scans-next" class="secondary compact-button" type="button" disabled>
              Next
            </button>
          </div>
        </section>
      </main>
    </div>
  </div>
</body>

</html>
