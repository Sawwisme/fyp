<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VetDental — Staff Portal</title>
    <link rel="stylesheet" href="/web/styles.css">
    <script src="/web/app.js" defer></script>
</head>

<body>
    <main class="card">
        <div class="brand">VetDental</div>
        <p class="subtitle">Veterinarian & Clinic Administrator Portal</p>

        <section id="login-section">
            <h1>Welcome back</h1>
            <p>Log in with your clinic account.</p>

            <form id="login-form" method="post" action="/auth/login">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" autocomplete="username" maxlength="255" required>

                <label for="password">Password</label>
                <div class="password-field">
                    <input id="password" name="password" type="password" autocomplete="current-password" required>
                    <button id="toggle-password" type="button" aria-label="Show password">Show</button>
                </div>

                <button id="login-button" class="primary" type="submit" disabled>
                    Log in
                </button>
            </form>
        </section>

        <section id="account-section" hidden>
            <h1 id="account-name"></h1>
            <p id="account-email"></p>
            <span id="account-role" class="badge"></span>
            <p>Your clinic account is connected.</p>
            <button id="logout-button" class="secondary" type="button">
                Log out
            </button>
        </section>

        <p id="message" role="status" aria-live="polite"></p>
        <noscript>Enable JavaScript to use the staff portal.</noscript>
    </main>
</body>

</html>
