<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>Reset password — VetDental</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #eef1f5;
            color: #172333;
            font-family: system-ui, sans-serif;
        }

        main {
            width: 100%;
            max-width: 440px;
            padding: 28px;
            background: white;
            border: 1px solid #dce3f0;
            border-radius: 20px;
        }

        .brand {
            color: #2549c7;
            font-size: 22px;
            font-weight: 700;
        }

        h1 {
            font-size: 25px;
        }

        p {
            line-height: 1.6;
        }

        label {
            display: block;
            margin: 20px 0 8px;
            font-weight: 600;
        }

        .field {
            display: flex;
            border: 1px solid #d3dce5;
            border-radius: 10px;
            overflow: hidden;
        }

        .field:focus-within {
            outline: 2px solid #2549c7;
        }

        input {
            width: 100%;
            min-width: 0;
            padding: 14px;
            border: 0;
            outline: 0;
            font: inherit;
        }

        .toggle {
            border: 0;
            background: white;
            padding: 0 14px;
            color: #2549c7;
            cursor: pointer;
        }

        .submit {
            width: 100%;
            margin-top: 24px;
            padding: 14px;
            border: 0;
            border-radius: 10px;
            background: #2549c7;
            color: white;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }

        button:disabled {
            opacity: .55;
            cursor: default;
        }

        #message {
            color: #b3261e;
            overflow-wrap: anywhere;
        }

        #message.success {
            color: #2549c7;
        }

        main {
            border-top: 5px solid #2549c7;
            box-shadow: 0 16px 48px #17233312;
        }

        .submit:hover:not(:disabled) {
            background: #1d3ba4;
        }

        button:focus-visible {
            outline: 3px solid #9aaff7;
            outline-offset: 3px;
        }
    </style>
</head>

<body>
    <main>
        <div class="brand">VetDental</div>
        <h1>Reset your password</h1>
        <p>Choose a new password with at least 8 characters.</p>

        <form id="reset-form" hidden>
            <label for="password">New password</label>
            <div class="field">
                <input id="password" type="password" autocomplete="new-password" required>
                <button class="toggle" type="button" data-target="password" aria-label="Show new password">
                    Show
                </button>
            </div>

            <label for="confirmation">Confirm new password</label>
            <div class="field">
                <input id="confirmation" type="password" autocomplete="new-password" required>
                <button class="toggle" type="button" data-target="confirmation" aria-label="Show password confirmation">
                    Show
                </button>
            </div>

            <button id="submit" class="submit" type="submit">
                Reset password
            </button>
        </form>

        <p id="message" role="status" aria-live="polite"></p>
        <button id="validate-retry" class="submit" type="button" hidden>
            Check link again
        </button>
        <p id="success-help" hidden>
            Return to the VetDental app and log in with your new password.
        </p>
    </main>

    <script>
        const form = document.getElementById('reset-form');
        const submit = document.getElementById('submit');
        const message = document.getElementById('message');
        const password = document.getElementById('password');
        const confirmation = document.getElementById('confirmation');
        const retry = document.getElementById('validate-retry');

        let token = new URLSearchParams(
            window.location.hash.slice(1)
        ).get('token');

        history.replaceState(null, '', window.location.pathname);

        let valid = false;
        let saving = false;
        let checking = false;
        let validUntil = 0;
        let expiryTimer;

        function hideForm(text, allowRetry = false) {
            clearTimeout(expiryTimer);
            valid = false;
            form.hidden = true;
            submit.disabled = true;
            password.value = '';
            confirmation.value = '';
            message.className = '';
            message.textContent = text;
            retry.hidden = !allowRetry;
        }

        function expireLink() {
            hideForm(
                'This reset link has expired. Request a new link ' +
                'from the sign-in screen.'
            );
        }

        function armExpiryTimer() {
            clearTimeout(expiryTimer);

            const remaining = validUntil - performance.now();

            if (remaining <= 0) {
                expireLink();
                return;
            }

            expiryTimer = setTimeout(expireLink, remaining);
        }

        async function post(path, body) {
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 20000);

            try {
                const response = await fetch(path, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'omit',
                    cache: 'no-store',
                    signal: controller.signal,
                    body: JSON.stringify(body)
                });

                return {
                    response,
                    data: await response.json()
                };
            } finally {
                clearTimeout(timeout);
            }
        }

        async function validateLink() {
            if (checking || saving) return;

            if (!token) {
                hideForm(
                    'This reset link is incomplete. Request a new link ' +
                    'from the sign-in screen.'
                );
                return;
            }

            checking = true;
            valid = false;
            clearTimeout(expiryTimer);
            form.hidden = true;
            retry.hidden = true;
            message.className = '';
            message.textContent = 'Checking your reset link…';

            try {
                const { response, data } = await post(
                    '/auth/reset-password/validate',
                    { token }
                );

                if (!response.ok) {
                    hideForm(
                        response.status === 400
                            ? 'This link is expired, invalid, or already used. ' +
                            'Request a new link from the sign-in screen.'
                            : typeof data.detail === 'string'
                                ? data.detail
                                : 'Unable to check this link.',
                        response.status !== 400
                    );
                    return;
                }

                if (
                    data.valid !== true ||
                    !Number.isFinite(data.expires_in) ||
                    data.expires_in <= 0
                ) {
                    expireLink();
                    return;
                }

                valid = true;
                validUntil = performance.now() + data.expires_in * 1000;
                form.hidden = false;
                submit.disabled = false;
                message.textContent = '';
                armExpiryTimer();
            } catch (_) {
                hideForm(
                    'Cannot check this link. Check your connection and try again.',
                    true
                );
            } finally {
                checking = false;
            }
        }

        document.querySelectorAll('.toggle').forEach(button => {
            button.addEventListener('click', () => {
                const input = document.getElementById(button.dataset.target);
                const show = input.type === 'password';

                input.type = show ? 'text' : 'password';
                button.textContent = show ? 'Hide' : 'Show';
                button.setAttribute(
                    'aria-label',
                    `${show ? 'Hide' : 'Show'} password`
                );
            });
        });

        form.addEventListener('submit', async event => {
            event.preventDefault();

            if (saving || checking || !valid || !token) return;

            if (performance.now() >= validUntil) {
                expireLink();
                return;
            }

            const newPassword = password.value;

            if ([...newPassword].length < 8) {
                message.textContent = 'Use at least 8 characters.';
                return;
            }

            if (new TextEncoder().encode(newPassword).length > 72) {
                message.textContent = 'Your password is too long.';
                return;
            }

            if (newPassword !== confirmation.value) {
                message.textContent = 'Passwords do not match.';
                return;
            }

            saving = true;
            clearTimeout(expiryTimer);
            submit.textContent = 'Saving…';
            message.textContent = '';

            form.querySelectorAll('input, button').forEach(element => {
                element.disabled = true;
            });

            try {
                const { response, data } = await post(
                    '/auth/reset-password',
                    {
                        token,
                        new_password: newPassword
                    }
                );

                if (!response.ok) {
                    const detail = typeof data.detail === 'string'
                        ? data.detail
                        : 'Unable to reset your password.';

                    if (
                        response.status === 400 &&
                        detail ===
                        'The reset link is invalid or expired. Request a new one.'
                    ) {
                        hideForm(detail);
                    } else {
                        message.textContent = detail;
                    }

                    return;
                }

                token = null;
                valid = false;
                form.hidden = true;
                password.value = '';
                confirmation.value = '';
                retry.hidden = true;
                message.className = 'success';
                message.textContent = 'Your password has been reset.';
                document.getElementById('success-help').hidden = false;
            } catch (_) {
                hideForm(
                    'Connection interrupted. Try logging in with your new ' +
                    'password first. You can check this link again if needed.',
                    true
                );
            } finally {
                saving = false;
                submit.textContent = 'Reset password';

                form.querySelectorAll('input, button').forEach(element => {
                    element.disabled = !valid;
                });

                if (valid) armExpiryTimer();
            }
        });

        retry.addEventListener('click', validateLink);

        document.addEventListener('visibilitychange', () => {
            if (
                !document.hidden &&
                valid &&
                !saving &&
                performance.now() >= validUntil
            ) {
                expireLink();
            }
        });

        validateLink();
    </script>
</body>

</html>
