<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>Reset password — VetDental</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #f5f7f5;
            color: #243429;
            font-family: system-ui, sans-serif;
        }

        main {
            width: 100%;
            max-width: 440px;
            padding: 28px;
            background: white;
            border: 1px solid #d5e3d6;
            border-radius: 20px;
        }

        .brand {
            color: #176b32;
            font-size: 22px;
            font-weight: 700;
        }

        h1 {
            font-size: 25px;
        }

        p {
            line-height: 1.6;
        }

        label {
            display: block;
            margin: 20px 0 8px;
            font-weight: 600;
        }

        .field {
            display: flex;
            border: 1px solid #a5b5a8;
            border-radius: 10px;
            overflow: hidden;
        }

        .field:focus-within {
            outline: 2px solid #176b32;
        }

        input {
            width: 100%;
            min-width: 0;
            padding: 14px;
            border: 0;
            outline: 0;
            font: inherit;
        }

        .toggle {
            border: 0;
            background: white;
            padding: 0 14px;
            color: #176b32;
            cursor: pointer;
        }

        .submit {
            width: 100%;
            margin-top: 24px;
            padding: 14px;
            border: 0;
            border-radius: 10px;
            background: #176b32;
            color: white;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }

        button:disabled {
            opacity: .55;
            cursor: default;
        }

        #message {
            color: #b3261e;
            overflow-wrap: anywhere;
        }

        #message.success {
            color: #176b32;
        }
    </style>
</head>

<body>
    <main>
        <div class="brand">VetDental</div>
        <h1>Reset your password</h1>
        <p>Choose a new password with at least 8 characters.</p>

        <form id="reset-form">
            <label for="password">New password</label>
            <div class="field">
                <input id="password" type="password" autocomplete="new-password" required>
                <button class="toggle" type="button" data-target="password" aria-label="Show new password">
                    Show
                </button>
            </div>

            <label for="confirmation">Confirm new password</label>
            <div class="field">
                <input id="confirmation" type="password" autocomplete="new-password" required>
                <button class="toggle" type="button" data-target="confirmation" aria-label="Show password confirmation">
                    Show
                </button>
            </div>

            <button id="submit" class="submit" type="submit">
                Reset password
            </button>
        </form>

        <p id="message" role="status" aria-live="polite"></p>
        <p id="success-help" hidden>
            Return to the VetDental app and log in with your new password.
        </p>
    </main>

    <script>
        const form = document.getElementById('reset-form');
        const submit = document.getElementById('submit');
        const message = document.getElementById('message');
        const password = document.getElementById('password');
        const confirmation = document.getElementById('confirmation');

        let token = new URLSearchParams(
            window.location.hash.slice(1)
        ).get('token');

        // Keep the reset token out of the visible address and browser history.
        history.replaceState(null, '', window.location.pathname);

        if (!token) {
            message.textContent =
                'This reset link is incomplete. Request a new link from the app.';
            submit.disabled = true;
        }

        document.querySelectorAll('.toggle').forEach(button => {
            button.addEventListener('click', () => {
                const input = document.getElementById(button.dataset.target);
                const show = input.type === 'password';
                input.type = show ? 'text' : 'password';
                button.textContent = show ? 'Hide' : 'Show';
                button.setAttribute('aria-label',
                    `${show ? 'Hide' : 'Show'} ${input.id === 'password'
                        ? 'new password' : 'password confirmation'}`);
            });
        });

        form.addEventListener('submit', async event => {
            event.preventDefault();
            message.className = '';
            message.textContent = '';

            const newPassword = password.value;

            if ([...newPassword].length < 8) {
                message.textContent = 'Use at least 8 characters.';
                return;
            }

            if (new TextEncoder().encode(newPassword).length > 72) {
                message.textContent = 'Your password is too long.';
                return;
            }

            if (newPassword !== confirmation.value) {
                message.textContent = 'Passwords do not match.';
                return;
            }

            if (!token || submit.disabled) return;

            submit.disabled = true;
            submit.textContent = 'Saving…';

            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 20000);

            try {
                const response = await fetch('/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'omit',
                    signal: controller.signal,
                    body: JSON.stringify({
                        token: token,
                        new_password: newPassword
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    message.textContent = typeof data.detail === 'string'
                        ? data.detail
                        : 'Unable to reset your password. Please try again.';
                    return;
                }

                token = null;
                password.value = '';
                confirmation.value = '';
                form.hidden = true;
                message.className = 'success';
                message.textContent = 'Your password has been reset.';
                document.getElementById('success-help').hidden = false;
            } catch (_) {
                message.textContent =
                    'Connection interrupted. Try logging in with your new password ' +
                    'before requesting another reset link.';
            } finally {
                clearTimeout(timeout);
                submit.disabled = !token;
                submit.textContent = 'Reset password';
            }
        });
    </script>
</body>

</html>
