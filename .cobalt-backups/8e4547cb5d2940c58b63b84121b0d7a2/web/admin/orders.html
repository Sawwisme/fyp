<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VetDental — Orders</title>

    <link rel="stylesheet" href="/web/styles.css">
    <link rel="stylesheet" href="/web/admin/dashboard.css">
    <link rel="stylesheet" href="/web/admin/layout.css">
    <link rel="stylesheet" href="/web/admin/orders.css">

    <script src="/web/admin/layout.js" defer></script>
    <script src="/web/admin/orders.js" defer></script>
</head>

<body>
    <div id="orders-loading" class="loading">
        <p id="orders-start-message" role="status">Loading orders…</p>
        <button id="orders-start-retry" type="button" hidden>
            Try again
        </button>
    </div>

    <div id="orders-workspace" class="workspace" hidden>
        <aside id="shared-sidebar" class="sidebar"></aside>

        <div class="content-area">
            <header id="shared-topbar" class="topbar"></header>

            <main class="main-content">
                <h1>Orders</h1>
                <p class="subtitle">
                    Review your clinic’s pickup and delivery orders.
                </p>

                <section class="panel">
                    <form id="orders-filters" class="orders-filters">
                        <div>
                            <label for="orders-search">Search</label>
                            <input id="orders-search" type="search" maxlength="100"
                                placeholder="Order number, recipient or phone">
                        </div>

                        <div>
                            <label for="orders-status">Order status</label>
                            <select id="orders-status">
                                <option value="">All statuses</option>
                                <option value="pending_payment">Pending payment</option>
                                <option value="confirmed">Confirmed — cash pickup</option>
                                <option value="paid">Paid</option>
                                <option value="processing">Processing</option>
                                <option value="ready_for_pickup">Ready for pickup</option>
                                <option value="shipped">Shipped</option>
                                <option value="completed">Completed</option>
                                <option value="cancelled">Cancelled</option>
                                <option value="expired">Expired</option>
                                <option value="refunded">Refunded</option>
                            </select>
                        </div>

                        <div>
                            <label for="orders-method">Receive order</label>
                            <select id="orders-method">
                                <option value="">Pickup and delivery</option>
                                <option value="pickup">Clinic pickup</option>
                                <option value="delivery">Delivery</option>
                            </select>
                        </div>

                        <button class="orders-primary" type="submit">
                            Search
                        </button>
                    </form>

                    <p id="orders-message" role="status"></p>
                    <button id="orders-retry" class="secondary" type="button" hidden>
                        Try again
                    </button>

                    <div class="orders-table-wrap">
                        <table class="orders-table">
                            <thead>
                                <tr>
                                    <th>Order</th>
                                    <th>Date</th>
                                    <th>Recipient</th>
                                    <th>Method</th>
                                    <th>Total</th>
                                    <th>Payment</th>
                                    <th>Order status</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="orders-rows"></tbody>
                        </table>
                    </div>

                    <div class="orders-pagination">
                        <button id="orders-previous" class="secondary" type="button" disabled>
                            Previous
                        </button>
                        <span id="orders-page">Page 1</span>
                        <button id="orders-next" class="secondary" type="button" disabled>
                            Next
                        </button>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <dialog id="order-dialog" aria-labelledby="order-dialog-title">
        <header class="order-dialog-header">
            <h2 id="order-dialog-title">Order details</h2>
            <button id="order-dialog-close" type="button" aria-label="Close order details">×</button>
        </header>

        <div id="order-dialog-content" class="order-dialog-content" aria-live="polite"></div>
    </dialog>
</body>

</html>
